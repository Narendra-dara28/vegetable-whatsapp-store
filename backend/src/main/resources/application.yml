server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: vegetable-catalog-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vegetable_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Nari@123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# Application Specific Properties
app:
  jwt:
    # 256-bit Hex secret key for HS256 JWT signature
    secret: ${JWT_SECRET:${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
    # Default 24 hours (86,400,000 ms)
    expiration-ms: ${JWT_EXPIRATION_MS:${APP_JWT_EXPIRATION_MS:86400000}}

  cors:
    allowed-origins: ${FRONTEND_URL:${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}}

  admin:
    username: ${ADMIN_USERNAME:${APP_ADMIN_USERNAME:SIva}}
    password: ${ADMIN_PASSWORD:${APP_ADMIN_PASSWORD:Siva@8179}}

  seed:
    sample-data: ${APP_SEED_SAMPLE_DATA:true}

logging:
  level:
    root: INFO
    com.vegetableapp: DEBUG
    org.springframework.security: INFO
