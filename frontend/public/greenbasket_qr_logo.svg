<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Drop Shadow for QR Code Contrast -->
    <filter id="qrShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    
    <!-- Outer White Ring Glow -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#052e16" flood-opacity="0.15" />
    </filter>

    <!-- Main Green Badge Gradient -->
    <linearGradient id="primaryGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Inner Radial Glow -->
    <radialGradient id="innerLight" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0" />
    </radialGradient>

    <!-- Basket Body Gradient -->
    <linearGradient id="basketWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Tomato Gradient -->
    <radialGradient id="tomatoGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </radialGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <!-- 1. Outer QR Safety Border: Thick Pure White Rim to prevent QR reader distortion -->
  <circle cx="250" cy="250" r="240" fill="#ffffff" filter="url(#qrShadow)" />

  <!-- 2. Dark Green Outline Ring for Premium Polish -->
  <circle cx="250" cy="250" r="226" fill="#ecfdf5" stroke="#10b981" stroke-width="4" />

  <!-- 3. Main Emerald Green Badge -->
  <circle cx="250" cy="250" r="216" fill="url(#primaryGreen)" filter="url(#softGlow)" />
  <circle cx="250" cy="250" r="216" fill="url(#innerLight)" />

  <!-- 4. Subtle Decorative Orbit Ring -->
  <circle cx="250" cy="250" r="202" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- 5. Fresh Veggies & Fruits Piled in Basket -->
  
  <!-- Lush Green Leaves (Broccoli / Spinach) -->
  <path d="M 180 200 C 160 170, 195 140, 225 165 C 240 145, 275 155, 270 185 C 285 170, 315 190, 295 215 Z" fill="url(#leafGrad)" />
  <circle cx="195" cy="185" r="22" fill="#22c55e" />
  <circle cx="225" cy="170" r="26" fill="#16a34a" />
  <circle cx="260" cy="180" r="24" fill="#15803d" />

  <!-- Plump Ripe Red Tomato -->
  <circle cx="215" cy="225" r="48" fill="url(#tomatoGrad)" />
  <!-- Tomato Highlight Specular -->
  <ellipse cx="200" cy="205" rx="14" ry="8" fill="#ffffff" opacity="0.45" transform="rotate(-25 200 205)" />
  <!-- Tomato Calyx (Green Star Top) -->
  <path d="M 215 178 L 221 170 L 217 181 L 226 179 L 216 184 L 220 191 L 213 186 L 208 192 L 211 184 L 202 181 L 212 179 Z" fill="#22c55e" />

  <!-- Crisp Orange Carrot Top -->
  <path d="M 270 230 L 320 180 L 335 195 Z" fill="#f97316" />
  <path d="M 315 185 L 345 160 M 325 180 L 338 152 M 328 190 L 358 178" stroke="#4ade80" stroke-width="6" stroke-linecap="round" />

  <!-- Golden Juicy Lemon / Mango on Right -->
  <ellipse cx="285" cy="235" rx="34" ry="30" fill="#facc15" transform="rotate(15 285 235)" />
  <ellipse cx="275" cy="225" rx="10" ry="5" fill="#fef08a" opacity="0.6" transform="rotate(15 275 225)" />

  <!-- 6. Basket Handle -->
  <path d="M 160 245 C 160 140, 340 140, 340 245" fill="none" stroke="#fef08a" stroke-width="14" stroke-linecap="round" />
  <path d="M 160 245 C 160 140, 340 140, 340 245" fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round" opacity="0.6" />

  <!-- 7. Basket Body (Modern Solid Geometric Weave) -->
  <path d="M 135 245 L 165 350 C 170 365, 185 375, 205 375 L 295 375 C 315 375, 330 365, 335 350 L 365 245 Z" fill="url(#basketWarm)" />
  
  <!-- Basket Rim Trim -->
  <rect x="125" y="240" width="250" height="18" rx="9" fill="#fef08a" />
  <rect x="125" y="244" width="250" height="8" rx="4" fill="#fbbf24" opacity="0.7" />

  <!-- Horizontal Wicker Weave Strips -->
  <path d="M 142 275 Q 250 285 358 275" fill="none" stroke="#fef3c7" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  <path d="M 150 310 Q 250 320 350 310" fill="none" stroke="#fef3c7" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  <path d="M 162 345 Q 250 352 338 345" fill="none" stroke="#fef3c7" stroke-width="5" stroke-linecap="round" opacity="0.9" />

  <!-- Vertical Weave Crossbars -->
  <path d="M 190 258 L 205 375 M 250 258 L 250 375 M 310 258 L 295 375" fill="none" stroke="#92400e" stroke-width="4.5" opacity="0.35" />

  <!-- 8. Bold Crisp Branding Banner: "GREEN BASKET" -->
  <g transform="translate(0, 360)">
    <!-- Banner Pill Background -->
    <rect x="110" y="30" width="280" height="48" rx="24" fill="#ffffff" filter="url(#softGlow)" />
    <rect x="114" y="34" width="272" height="40" rx="20" fill="#065f46" />
    
    <!-- Text -->
    <text x="250" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">GREEN BASKET</text>
  </g>

  <!-- 9. Sparkling Freshness Stars -->
  <path d="M 370 160 Q 370 172 382 172 Q 370 172 370 184 Q 370 172 358 172 Q 370 172 370 160 Z" fill="#ffffff" />
  <path d="M 130 180 Q 130 188 138 188 Q 130 188 130 196 Q 130 188 122 188 Q 130 188 130 180 Z" fill="#fef08a" />
</svg>
