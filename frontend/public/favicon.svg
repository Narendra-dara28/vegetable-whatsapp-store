<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background Container -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  
  <!-- Basket Handle -->
  <path d="M 32 46 C 32 26, 68 26, 68 46" fill="none" stroke="#fef08a" stroke-width="5" stroke-linecap="round" />
  
  <!-- Veggies peaking out of basket -->
  <!-- Tomato / Apple -->
  <circle cx="42" cy="42" r="11" fill="#ef4444" />
  <circle cx="40" cy="39" r="3" fill="#fca5a5" opacity="0.6" />
  
  <!-- Carrot top -->
  <path d="M 52 46 L 63 32 L 67 36 Z" fill="#f97316" />
  <path d="M 64 33 L 72 27 M 65 32 L 68 23 M 66 35 L 75 33" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />

  <!-- Green Broccoli / Lettuce leaf -->
  <circle cx="34" cy="40" r="9" fill="url(#leafGrad)" />
  <circle cx="28" cy="43" r="7" fill="#15803d" />

  <!-- Basket Body -->
  <path d="M 23 48 L 30 78 C 31 82, 35 84, 40 84 L 60 84 C 65 84, 69 82, 70 78 L 77 48 Z" fill="url(#basketGrad)" />
  
  <!-- Basket Woven Ribs / Texture -->
  <path d="M 24 54 L 76 54 M 27 64 L 73 64 M 29 74 L 71 74" fill="none" stroke="#fed7aa" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M 40 48 L 44 84 M 50 48 L 50 84 M 60 48 L 56 84" fill="none" stroke="#c2410c" stroke-width="2" opacity="0.4" />
  
  <!-- Fresh Basket Sparkle -->
  <path d="M 78 24 Q 78 28 82 28 Q 78 28 78 32 Q 78 28 74 28 Q 78 28 78 24 Z" fill="#ffffff" />
</svg>